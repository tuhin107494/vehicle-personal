<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#059669" />
    <title>Offline · Gari Becho</title>
    <style>
      /* everything is inline: nothing else can be fetched from here while offline */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #ecfdf5;
        color: #1e293b;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", "Hind Siliguri", sans-serif;
        text-align: center;
      }
      main {
        width: 100%;
        max-width: 24rem;
        padding: 32px 24px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 0 0 1px #a7f3d0, 0 4px 12px rgb(0 0 0 / 0.06);
      }
      svg { width: 64px; height: 64px; }
      h1 { margin: 16px 0 8px; font-size: 1.25rem; }
      p { margin: 0 0 4px; color: #475569; line-height: 1.5; }
      .bn { margin-top: 16px; }
      a {
        display: inline-block;
        margin-top: 24px;
        padding: 10px 20px;
        border-radius: 8px;
        background: #047857;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { background: #065f46; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="12" fill="#059669" />
        <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
          <circle cx="7" cy="17" r="2" />
          <path d="M9 17h6" />
          <circle cx="17" cy="17" r="2" />
        </g>
      </svg>
      <h1>You're offline.</h1>
      <p>Please check your connection.</p>
      <div class="bn" lang="bn">
        <h1>আপনি অফলাইনে আছেন।</h1>
        <p>অনুগ্রহ করে আপনার সংযোগ পরীক্ষা করুন।</p>
      </div>
      <!-- an empty href reloads the page the person was trying to open -->
      <a href="">Try again · আবার চেষ্টা করুন</a>
    </main>
  </body>
</html>
